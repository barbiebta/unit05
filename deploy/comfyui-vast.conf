[program:comfyui-unit05]
environment=PROC_NAME="%(program_name)s"
command=/opt/supervisor-scripts/comfyui-unit05.sh
autostart=true
autorestart=unexpected
startsecs=8
startretries=5
stopwaitsecs=30
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
redirect_stderr=true
stdout_logfile_maxbytes=0
